[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numgrad"
version = "0.1.0"
description = "A reverse-mode autodiff engine and neural network framework built from scratch on NumPy."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Danial" }]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "matplotlib"]

[project.urls]
Repository = "https://github.com/DanHashes/numgrad"

[tool.hatch.build.targets.wheel]
packages = ["src/numgrad"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/numgrad"]
